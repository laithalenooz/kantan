<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- The page is light by decision and the direction contract locks one
         theme. Declared here as well as in tokens.css so the browser knows
         before any CSS arrives, which keeps the first paint from flashing a
         dark default. There is no dark variant. -->
    <meta name="color-scheme" content="only light" />

    <title>kantan</title>

    <!-- The brand mark, inline. A data URI rather than a file because this
         server has no route that serves one: every path goes through the
         Host, Origin and token chain by design, and adding a public file
         route for an icon would be the one exception to that. It also
         means the browser never requests /favicon.ico, which would 404. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23111216'/><circle cx='16' cy='16' r='6' fill='%23ff6a1a'/></svg>">

    <!-- Fonts are self-hosted from src/ui/fonts and declared with @font-face in
         tokens.css. Deliberately no Google Fonts <link>: it is a third-party
         request on every load of a tool that binds to loopback precisely so it
         talks to nothing. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
